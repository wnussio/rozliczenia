# Publikuje aplikację (folder app/) na GitHub Pages po każdej zmianie w repozytorium.
name: Aplikacja na telefon

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wersja aplikacji (żeby telefony dostały aktualizację)
        run: sed -i "s/__VERSION__/${GITHUB_SHA::7}/" app/sw.js app/app.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
